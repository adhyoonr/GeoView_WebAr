<!DOCTYPE html>
<html>
<head>
  <title>GeoView WebAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <script src="js/popup.js" defer></script>
</head>

<body style="margin: 0; overflow: hidden">

  <!-- START SCREEN -->
  <div id="start-screen" class="start-screen">
    <h1>GeoView WebAR</h1>
    <p>Pelajari bangun ruang 3D dengan teknologi Augmented Reality.</p>

    <button id="start-btn" class="btn-start">Mulai AR</button>
    <button id="start-exit-btn" class="btn-exit">Keluar Aplikasi</button>
  </div>

  <!-- POPUP -->
  <div id="popup" class="popup hidden">
    <div id="popup-content"></div>
    <button id="close-btn" onclick="closePopup()">Tutup</button>
  </div>

  <!-- EXIT BUTTON (selama kamera ON) -->
  <button id="exit-btn-overlay" class="exit-btn">Keluar</button>

  <!-- AR CAMERA SCENE -->
  <a-scene 
      id="ar-scene"
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false;"
      loading-screen="enabled:false" 
      style="display: none;"
  >

    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>

    <!-- KUBUS -->
    <a-marker type="pattern" url="markers/pattern-kubusgambar.patt" id="marker-kubus">
      <a-entity gltf-model="models/kubus.glb" scale="0.3 0.3 0.3"></a-entity>
    </a-marker>

    <!-- BALOK -->
    <a-marker type="pattern" url="markers/pattern-balokgambar.patt" id="marker-balok">
      <a-entity gltf-model="models/balok.glb" scale="0.3 0.3 0.3" rotation="90 0 0"></a-entity>
    </a-marker>

    <!-- PRISMA -->
    <a-marker type="pattern" url="markers/pattern-prismagambar.patt" id="marker-prisma">
      <a-entity gltf-model="models/prisma.glb" scale="0.3 0.3 0.3"  rotation="90 0 0"></a-entity>
    </a-marker>

    <!-- TABUNG -->
    <a-marker type="pattern" url="markers/pattern-tabunggambar.patt" id="marker-tabung">
      <a-entity gltf-model="models/tabung.glb" scale="0.3 0.3 0.3"  rotation="90 0 0"></a-entity>
    </a-marker>

    <!-- LIMAS -->
    <a-marker type="pattern" url="markers/pattern-limasgambar.patt" id="marker-limas">
      <a-entity gltf-model="models/limas.glb" scale="0.3 0.3 0.3"  rotation="90 0 0"></a-entity>
    </a-marker>

    <!-- BOLA -->
    <a-marker type="pattern" url="markers/pattern-bolagambar.patt" id="marker-bola">
      <a-entity gltf-model="models/bola.glb" scale="0.35 0.35 0.35"></a-entity>
    </a-marker>

    <!-- KERUCUT -->
    <a-marker type="pattern" url="markers/pattern-kerucutgambar.patt" id="marker-kerucut">
      <a-entity gltf-model="models/kerucut.glb" scale="0.3 0.3 0.3"  rotation="90 0 0"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
